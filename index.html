<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodent Defense | Agricultural Protection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .header-font { font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <!-- Navbar -->
    <nav class="bg-black border-b border-green-600">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-green-600 flex items-center justify-center text-black font-bold header-font">RD</div>
                <div>
                    <span class="text-2xl font-bold tracking-tighter header-font">RODENT DEFENSE</span>
                </div>
            </div>
            <div class="flex gap-8 text-sm uppercase tracking-widest">
                <a href="#" class="hover:text-green-400">SOLUTIONS</a>
                <a href="#" class="hover:text-green-400">TECHNOLOGY</a>
                <a href="#" class="hover:text-green-400">FIELD DATA</a>
                <a href="#" class="hover:text-green-400">CONTACT</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="min-h-screen bg-[radial-gradient(#166534_1px,transparent_1px)] bg-[length:50px_50px] flex items-center">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <div class="inline-flex items-center bg-green-950 border border-green-700 px-4 py-1 rounded-full text-green-400 text-sm mb-6">
                SECURE • PRECISE • RELIABLE
            </div>
            <h1 class="text-7xl font-bold tracking-tighter header-font mb-6">PROTECTING YOUR HARVEST</h1>
            <p class="text-2xl text-zinc-400 max-w-2xl mx-auto">Advanced rodent management systems engineered for agricultural operations. Defense-grade technology for field deployment.</p>
            <div class="mt-10 flex justify-center gap-4">
                <button onclick="document.getElementById('contact').scrollIntoView({behavior: 'smooth'})" class="bg-green-600 hover:bg-green-500 text-black px-8 py-4 rounded font-semibold uppercase tracking-wider">DEPLOY SOLUTION</button>
                <button class="border border-white/50 hover:bg-white/10 px-8 py-4 rounded font-semibold uppercase tracking-wider">VIEW INTEL</button>
            </div>
        </div>
    </section>

    <!-- Content sections would go here -->
    <footer class="bg-black py-12 border-t border-green-900">
        <div class="max-w-7xl mx-auto px-6 text-center text-zinc-500 text-sm">
            © Rodent Defense Systems • Classified Agricultural Protection
        </div>
    </footer>
</body>
</html>
